[package]
name = "jg"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first, git-compatible version control"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
sha2 = "0.11.1"
similar = "3.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# `cargo deb` (see docs/RELEASING.md). Completions are generated by scripts/release.sh first.
[package.metadata.deb]
maintainer = "jg maintainers <jg@localhost>"
section = "vcs"
priority = "optional"
extended-description = """\
jg is a small, local-first version control system with git-compatible \
commits. History can be exported to a real git repository at any time."""
depends = "$auto"
recommends = "openssh-client, curl"
assets = [
    ["target/release/jg", "usr/bin/", "755"],
    ["target/completions/jg.bash", "usr/share/bash-completion/completions/jg", "644"],
    ["target/completions/_jg", "usr/share/zsh/vendor-completions/_jg", "644"],
    ["target/completions/jg.fish", "usr/share/fish/vendor_completions.d/jg.fish", "644"],
    ["README.md", "usr/share/doc/jg/README.md", "644"],
    ["docs/AGENT_GUIDE.md", "usr/share/doc/jg/AGENT_GUIDE.md", "644"],
]
